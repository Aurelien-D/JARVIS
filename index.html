<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>J.A.R.V.I.S.</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="jarvis-token" content="__JARVIS_TOKEN__">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%2340dcff' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%2340dcff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<!-- Exact versions + integrity hashes: a library update can't break or tamper with the UI. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridjs@6.2.0/dist/theme/mermaid.min.css"
      integrity="sha384-i8iPOOXHyYKlqvjJjbORq7m/VrfUhgupTg3IZvtXz8M7c0CiTPUUhM5gdjiQiGbv" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/marked@18.0.13/lib/marked.umd.js"
        integrity="sha384-Jy8qDMspJASzATgFngF2ompIKy0StbCcvuTE65mxDm/E0/YSIF6Ndc+5V7bbwRcw" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.15/dist/purify.min.js"
        integrity="sha384-uUMu9JDY09vBzRf9SPcK2VgUj+W/70J6Soc+Dded5P474ElQ63iv9j5N3DE7Kp3N" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@7.4.0/dist/apexcharts.min.js"
        integrity="sha384-fnhrfzODrKsQTTXTYoDIc5f/SIP1KuiO4hz6PmkcIBHYVaAj8QpSOtByqodkU2iO" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/gridjs@6.2.0/dist/gridjs.umd.js"
        integrity="sha384-y62I+ZvjNRolkugL/AMpUZykqrL6oqYxBruObmlDAhDpmapM0s+xgvVK+wGVpza0" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #010409; --panel: rgba(6,14,24,.78); --line: rgba(64,220,255,.18);
    --cyan: #40dcff; --cyan-dim: #1e7ea3; --amber: #ffb347; --text: #cfeaff;
    --dim: #4d7c99; --ok: #43ffa4; --err: #ff5470;
    --font-hud: "Rajdhani", sans-serif; --font-mono: "Share Tech Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(1100px 650px at 50% 38%, rgba(20,60,100,.35) 0%, transparent 60%),
      var(--bg);
    color: var(--text); font-family: var(--font-hud);
    height: 100vh; overflow: hidden; display: flex;
  }
  /* hex grid + scanlines overlay */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .5;
    background-image:
      repeating-linear-gradient(0deg, rgba(64,220,255,.028) 0 1px, transparent 1px 3px),
      linear-gradient(rgba(64,220,255,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(64,220,255,.045) 1px, transparent 1px);
    background-size: 100% 3px, 52px 52px, 52px 52px;
  }
  /* subtle vignette */
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 220px rgba(0,0,0,.85);
  }

  /* ------------------------------------------------ HUD chrome */
  .corner { position: fixed; width: 46px; height: 46px; pointer-events: none; z-index: 5; }
  .corner::before { content: ""; position: absolute; inset: 0; border: 2px solid var(--cyan); opacity: .55; }
  .corner.tl { top: 14px; left: 14px; } .corner.tl::before { border-right: 0; border-bottom: 0; }
  .corner.tr { top: 14px; right: 358px; } .corner.tr::before { border-left: 0; border-bottom: 0; }
  .corner.bl { bottom: 14px; left: 14px; } .corner.bl::before { border-right: 0; border-top: 0; }
  .corner.br { bottom: 14px; right: 358px; } .corner.br::before { border-left: 0; border-top: 0; }

  #topbar {
    position: fixed; top: 20px; left: 80px; right: 420px; z-index: 5;
    display: flex; justify-content: space-between; align-items: center;
    font-family: var(--font-mono); font-size: 11px; color: var(--dim);
    letter-spacing: .28em; text-transform: uppercase;
  }
  #topbar .sys { color: var(--cyan); text-shadow: 0 0 12px rgba(64,220,255,.8); }
  #clock { color: var(--amber); }

  #stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
  #orb { width: min(48vh, 440px); height: min(48vh, 440px); cursor: pointer; filter: drop-shadow(0 0 35px rgba(64,220,255,.25)); }
  #status {
    margin-top: 6px; letter-spacing: .45em; text-transform: uppercase;
    font-size: 12px; font-weight: 600; color: var(--dim); font-family: var(--font-mono);
    text-align: center; max-width: 80%;
  }
  #status b { color: var(--cyan); font-weight: 600; text-shadow: 0 0 14px rgba(64,220,255,.9); }
  #hint { position: absolute; bottom: 22px; font-size: 11px; color: var(--dim); font-family: var(--font-mono); letter-spacing: .2em; }
  #you {
    position: absolute; top: 54px; left: 50%; transform: translateX(-50%);
    max-width: 60%; text-align: center; font-size: 13px; color: var(--dim);
    font-family: var(--font-mono); letter-spacing: .03em; min-height: 18px;
  }
  #transcript {
    position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
    max-width: 68%; text-align: center; font-size: 15px; font-weight: 500;
    color: #9fd4f5; min-height: 22px; text-shadow: 0 0 18px rgba(64,220,255,.35);
  }

  /* ------------------------------------------------ controls */
  #controls { position: absolute; bottom: 46px; display: flex; gap: 10px; z-index: 5; }
  .ctl {
    background: transparent; border: 1px solid var(--line); color: var(--dim);
    font-family: var(--font-mono); font-size: 11px; letter-spacing: .2em; text-transform: uppercase;
    padding: 6px 12px; cursor: pointer;
  }
  .ctl:hover { color: var(--cyan); border-color: var(--cyan-dim); }
  .ctl b { color: var(--cyan); font-weight: 400; }
  .ctl.off b { color: var(--dim); }
  .ctl[hidden] { display: none; }

  /* ------------------------------------------------ display cards (HUD holograms) */
  #cards {
    position: absolute; top: 96px; left: 34px; bottom: 30px; width: 330px;
    display: flex; flex-direction: column; gap: 14px; overflow-y: auto;
    pointer-events: none; scrollbar-width: none; z-index: 4;
  }
  .card {
    pointer-events: auto; position: relative;
    background: linear-gradient(135deg, rgba(64,220,255,.10), rgba(6,14,24,.85) 45%);
    border: 1px solid var(--line); border-left: 3px solid var(--cyan);
    padding: 12px 14px 12px 16px; backdrop-filter: blur(6px);
    clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 0 100%);
    animation: materialize .45s cubic-bezier(.2,.9,.3,1);
    box-shadow: 0 0 24px rgba(64,220,255,.10), inset 0 0 30px rgba(64,220,255,.04);
  }
  @keyframes materialize {
    0% { transform: translateX(-24px) skewX(-4deg); opacity: 0; filter: brightness(3); }
    60% { filter: brightness(1.6); }
    100% { transform: none; opacity: 1; filter: none; }
  }
  .card.warning { border-left-color: var(--amber); }
  .card.result { border-left-color: var(--ok); }
  .card h3 {
    font-size: 12px; letter-spacing: .3em; text-transform: uppercase; font-weight: 700;
    color: var(--cyan); margin-bottom: 8px; font-family: var(--font-mono);
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .card.warning h3 { color: var(--amber); } .card.result h3 { color: var(--ok); }
  .card h3 .x { cursor: pointer; color: var(--dim); font-size: 13px; letter-spacing: 0; }
  .card h3 .x:hover { color: var(--err); }
  .card .body { font-size: 14px; line-height: 1.5; color: var(--text); white-space: pre-wrap; word-break: break-word; }
  .card .body code {
    font-family: var(--font-mono); font-size: 12.5px; color: var(--amber);
    background: rgba(255,179,71,.08); padding: 1px 5px; border-radius: 2px;
  }
  .card .body ul { margin: 4px 0 0 16px; }
  .card .body img { display: block; width: 100%; margin-top: 4px; border: 1px solid var(--line); }
  /* marked output already carries its own line breaks */
  .card .body.md { white-space: normal; }
  .card .body.md p, .card .body.md ul, .card .body.md ol { margin: 0 0 6px; }
  .card .body.md ul, .card .body.md ol { padding-left: 16px; }
  .card .body.md > :last-child { margin-bottom: 0; }
  .card.code .body { font-family: var(--font-mono); font-size: 12px; color: #9fd4f5; }

  /* ------------------------------------------------ right panel */
  #side {
    width: 340px; border-left: 1px solid var(--line); background: var(--panel);
    backdrop-filter: blur(10px); padding: 18px; overflow-y: auto; z-index: 6;
  }
  #side section { margin-bottom: 26px; }
  /* a long task history must not push reminders and memory off screen */
  #tasks { max-height: 46vh; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--cyan-dim) transparent; }
  #side h2 {
    font-size: 11px; letter-spacing: .34em; text-transform: uppercase; color: var(--cyan);
    margin-bottom: 14px; font-family: var(--font-mono);
    border-bottom: 1px solid var(--line); padding-bottom: 10px;
    text-shadow: 0 0 10px rgba(64,220,255,.6);
  }
  .task {
    border: 1px solid var(--line); border-left: 3px solid var(--cyan);
    padding: 12px 14px; margin-bottom: 12px;
    background: linear-gradient(180deg, rgba(64,220,255,.06), transparent);
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
    animation: materialize .35s ease;
  }
  .task .t { font-size: 14px; font-weight: 600; margin-bottom: 4px; letter-spacing: .04em; }
  .task .meta { font-size: 10px; color: var(--dim); letter-spacing: .14em; text-transform: uppercase; font-family: var(--font-mono); margin-bottom: 6px; }
  .task .s { font-size: 11px; color: var(--dim); display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); }
  .task .prog { font-size: 11px; color: var(--amber); margin-top: 6px; font-family: var(--font-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .task .prog:empty { display: none; }
  .task .out { font-size: 11px; color: #a9cbe4; margin-top: 8px; max-height: 120px; overflow: auto; white-space: pre-wrap; font-family: var(--font-mono); }
  .task .out:empty { display: none; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); animation: blink 1s infinite alternate; }
  .task.done { border-left-color: var(--ok); } .task.done .dot { background: var(--ok); box-shadow: 0 0 8px var(--ok); animation: none; }
  .task.error { border-left-color: var(--err); } .task.error .dot { background: var(--err); box-shadow: 0 0 8px var(--err); animation: none; }
  .task.cancelled { border-left-color: var(--dim); opacity: .65; } .task.cancelled .dot { background: var(--dim); box-shadow: none; animation: none; }
  .task .cancel { margin-left: auto; cursor: pointer; color: var(--dim); }
  .task .cancel:hover { color: var(--err); }
  @keyframes blink { to { opacity: .2; } }
  .none { font-size: 12px; color: var(--dim); font-style: italic; }
  .item { display: flex; gap: 10px; align-items: baseline; font-size: 13px; padding: 7px 0; border-bottom: 1px dashed var(--line); }
  .item .when { font-family: var(--font-mono); font-size: 11px; color: var(--amber); white-space: nowrap; }
  .item .txt { flex: 1; word-break: break-word; }
  .item .x { cursor: pointer; color: var(--dim); }
  .item .x:hover { color: var(--err); }

  /* ------------------------------------------------ report dashboard overlay */
  #report {
    position: fixed; inset: 60px 380px 40px 60px; z-index: 20; display: none;
    background: rgba(5,12,22,.96); border: 1px solid var(--line);
    border-top: 2px solid var(--cyan); backdrop-filter: blur(14px);
    box-shadow: 0 0 60px rgba(0,0,0,.7), 0 0 30px rgba(64,220,255,.08);
    padding: 22px 26px; overflow-y: auto; animation: materialize .35s ease;
  }
  #report.open { display: block; }
  #report .rhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  #report .rhead h2 { font-size: 16px; letter-spacing: .22em; text-transform: uppercase; color: var(--cyan); font-family: var(--font-mono); }
  #report .rhead .x { cursor: pointer; color: var(--dim); font-size: 18px; }
  #report .rhead .x:hover { color: var(--err); }
  #kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .kpi { border: 1px solid var(--line); border-left: 3px solid var(--cyan); padding: 12px 14px; background: rgba(64,220,255,.04); }
  .kpi .l { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); font-family: var(--font-mono); }
  .kpi .v { font-size: 26px; font-weight: 700; color: var(--text); margin-top: 4px; }
  .kpi .d { font-size: 12px; font-family: var(--font-mono); margin-top: 2px; color: var(--ok); }
  .kpi .d.neg { color: var(--err); }
  #rchart { margin-bottom: 18px; }
  #rtable { margin-bottom: 18px; }
  /* Grid.js dark re-skin */
  #rtable .gridjs-wrapper, #rtable .gridjs-table { background: transparent; box-shadow: none; }
  #rtable th.gridjs-th { background: rgba(64,220,255,.06); color: var(--cyan); border-color: var(--line); font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; }
  #rtable td.gridjs-td, #rtable .gridjs-tr, #rtable .gridjs-tbody { background: transparent !important; color: var(--text); border-color: var(--line); font-size: 13px; }
  #rtable .gridjs-tr:hover td { background: rgba(64,220,255,.06) !important; }
  #rtable .gridjs-search input, #rtable .gridjs-pagination { background: transparent; color: var(--dim); border-color: var(--line); }
  #rtable .gridjs-pagination button { background: transparent; color: var(--dim); border-color: var(--line); }
  #rtable .gridjs-pagination button.gridjs-currentPage { background: rgba(64,220,255,.12); color: var(--cyan); }
  #rmd { font-size: 14px; line-height: 1.6; color: var(--text); }
  #rmd h1, #rmd h2, #rmd h3 { color: var(--cyan); margin: 12px 0 6px; font-family: var(--font-hud); }
  #rmd table { border-collapse: collapse; margin: 8px 0; }
  #rmd th, #rmd td { border: 1px solid var(--line); padding: 5px 10px; font-size: 13px; }
  #rmd code { font-family: var(--font-mono); color: var(--amber); background: rgba(255,179,71,.08); padding: 1px 5px; }
  #rmd ul, #rmd ol { margin: 6px 0 6px 20px; }
</style>
</head>
<body>
  <div class="corner tl"></div><div class="corner tr"></div>
  <div class="corner bl"></div><div class="corner br"></div>
  <div id="topbar">
    <span class="sys">◈ J.A.R.V.I.S. — MARK VIII</span>
    <span id="clock">--:--:--</span>
  </div>

  <div id="stage">
    <div id="you"></div>
    <div id="transcript"></div>
    <div id="cards"></div>
    <canvas id="orb"></canvas>
    <div id="status">clique l'orbe pour <b>initialiser</b></div>
    <div id="controls">
      <button id="wakeBtn" class="ctl" type="button" hidden></button>
      <button id="notifBtn" class="ctl" type="button" hidden>activer les notifications</button>
    </div>
    <div id="hint">SYSTÈME LOCAL · OPENAI REALTIME · CLAUDE CODE</div>
  </div>
  <div id="report">
    <div class="rhead"><h2 id="rtitle"></h2><span class="x" onclick="document.getElementById('report').classList.remove('open')">✕</span></div>
    <div id="kpis"></div>
    <div id="rchart"></div>
    <div id="rtable"></div>
    <div id="rmd"></div>
  </div>

  <aside id="side">
    <section>
      <h2>⟢ Sessions Claude Code</h2>
      <div id="tasks"><div class="none">Aucune session. Demande une tâche à la voix.</div></div>
    </section>
    <section>
      <h2>⟢ Rappels &amp; routines</h2>
      <div id="schedules"></div>
    </section>
    <section>
      <h2>⟢ Mémoire</h2>
      <div id="memory"></div>
    </section>
  </aside>

<script src="/static/jarvis.js"></script>
</body>
</html>
