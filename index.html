<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>J.A.R.V.I.S.</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="jarvis-token" content="__JARVIS_TOKEN__">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%2340dcff' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%2340dcff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<!-- Exact versions + integrity hashes: a library update can't break or tamper with the UI. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridjs@6.2.0/dist/theme/mermaid.min.css"
      integrity="sha384-i8iPOOXHyYKlqvjJjbORq7m/VrfUhgupTg3IZvtXz8M7c0CiTPUUhM5gdjiQiGbv" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/marked@18.0.13/lib/marked.umd.js"
        integrity="sha384-Jy8qDMspJASzATgFngF2ompIKy0StbCcvuTE65mxDm/E0/YSIF6Ndc+5V7bbwRcw" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.15/dist/purify.min.js"
        integrity="sha384-uUMu9JDY09vBzRf9SPcK2VgUj+W/70J6Soc+Dded5P474ElQ63iv9j5N3DE7Kp3N" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@7.4.0/dist/apexcharts.min.js"
        integrity="sha384-fnhrfzODrKsQTTXTYoDIc5f/SIP1KuiO4hz6PmkcIBHYVaAj8QpSOtByqodkU2iO" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/gridjs@6.2.0/dist/gridjs.umd.js"
        integrity="sha384-y62I+ZvjNRolkugL/AMpUZykqrL6oqYxBruObmlDAhDpmapM0s+xgvVK+wGVpza0" crossorigin="anonymous"></script>
<!-- One stylesheet per concern, in cascade order (later files may refine earlier ones). -->
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/layout.css">
<link rel="stylesheet" href="/static/css/components.css">
<link rel="stylesheet" href="/static/css/orb.css">
<link rel="stylesheet" href="/static/css/composer.css">
<link rel="stylesheet" href="/static/css/panels.css">
<link rel="stylesheet" href="/static/css/confirm.css">
<link rel="stylesheet" href="/static/css/journal.css">
<link rel="stylesheet" href="/static/css/report.css">
<link rel="stylesheet" href="/static/css/settings.css">
<link rel="stylesheet" href="/static/css/ares.css">
<link rel="stylesheet" href="/static/css/usage.css">
</head>
<body data-state="off-idle">
  <a class="skip" href="#askInput">Aller au champ de message</a>
  <div class="corner tl"></div><div class="corner tr"></div>
  <div class="corner bl"></div><div class="corner br"></div>
  <header id="topbar">
    <span class="brand">◈ J.A.R.V.I.S. — MARK VIII</span>
    <div id="topChips"><span id="serverChip"></span><span id="dndChip"></span><span id="aresChip"></span><span id="costChip"></span></div>
    <time id="clock">--:--:--</time>
    <nav id="topActions" aria-label="Actions"></nav>
  </header>

  <section id="cards" aria-label="Affichages de JARVIS"></section>

  <main id="stage">
    <button id="badge" type="button" hidden></button>
    <button id="orbBtn" type="button" aria-label="Parler à JARVIS"><canvas id="orb" aria-hidden="true"></canvas></button>
    <div id="statusPill" role="status" aria-live="polite">clique l'orbe pour <b>initialiser</b></div>
    <div id="caption" aria-hidden="true"><p id="you"></p><p id="transcript"></p></div>
    <div id="chips"></div>
    <div id="composer"></div>
    <div id="controls">
      <button id="wakeBtn" class="ctl" type="button" hidden></button>
      <button id="notifBtn" class="ctl" type="button" hidden>activer les notifications</button>
    </div>
    <div id="controlsExtra"></div>
    <p id="hint">SYSTÈME LOCAL · OPENAI REALTIME · CLAUDE CODE</p>
  </main>

  <aside id="side" aria-label="Panneau latéral">
    <section id="remarques" hidden></section>
    <section id="agenda" hidden></section>
    <section id="tasks">
      <h2>⟢ Sessions Claude Code</h2>
      <div id="taskList"><div class="none">Aucune session. Demande une tâche à la voix.</div></div>
    </section>
    <section id="schedules">
      <h2>⟢ Rappels &amp; routines</h2>
      <div id="scheduleList"></div>
    </section>
    <section id="memory">
      <h2>⟢ Mémoire</h2>
      <div id="memoryList"></div>
    </section>
  </aside>
  <aside id="journalDrawer" class="drawer" aria-label="Journal" hidden></aside>

  <dialog id="settingsDialog" class="drawer-dialog" aria-labelledby="settingsTitle"></dialog>
  <dialog id="report" aria-labelledby="rtitle">
    <div class="rhead"><h2 id="rtitle"></h2><span class="x">✕</span></div>
    <div id="kpis"></div>
    <div id="rchart"></div>
    <div id="rtable"></div>
    <div id="rmd"></div>
  </dialog>
  <dialog id="taskView" aria-labelledby="tvTitle"></dialog>
  <dialog id="onboarding" aria-labelledby="obTitle"></dialog>

  <div id="toasts" aria-live="polite"></div>
  <div id="sr" class="visually-hidden" aria-live="polite"></div>
  <div id="srAlert" class="visually-hidden" role="alert"></div>
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
